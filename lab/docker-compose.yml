# Due bersagli volutamente vulnerabili su una rete isolata. Mai su una rete vera.
services:
  juice-shop:
    image: bkimminich/juice-shop
    networks:
      lab:
        ipv4_address: 172.28.0.10
  dvwa:
    image: vulnerables/web-dvwa
    networks:
      lab:
        ipv4_address: 172.28.0.11

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
